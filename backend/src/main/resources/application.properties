server.port=${PORT:8080}
spring.application.name=code3d-backend

# Database Configuration (Neon PostgreSQL)
spring.datasource.url=${DB_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/code3ddb}}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# HikariCP Connection Pool (optimized for Neon serverless pooler)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# Logging configuration
logging.level.com.code3d=INFO
logging.level.org.springframework.web=INFO
